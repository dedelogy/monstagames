<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">

<style>

<div id="w"><canvas id="g" width="240" height="160"></canvas><canvas id="o"></canvas><div id="zn"></div><div id="dl"></div></div>
<p>PANAH = GERAK &nbsp; SPASI = INTERAKSI &nbsp; G = GRID</p>
<script>
/* ===== DATA MODEL: semua map = array 2D [y][x] =====
 gr[y][x]  id tanah (0 rumput,1 jalan semi-paved,2 paved terang,3 paved gelap distrik,4 plaza,5 tembok,6 dais,7 tangga)
 fl[y][x]  bitmask flag: MOVE movableArea | TOP hasObjectOnTop | HIGH isHigherGround | LOW isLowerGround | NEXT toNextInstance | TALK interactable
 ob[y][x]  id objek template yang menempati tile (0 = kosong)
 meta{"x,y"} data tambahan: {say:[...]} atau {next:'nama_map'} */
const W=56,H=40,T=16,STEP=10;
const F={MOVE:1,TOP:2,HIGH:4,LOW:8,NEXT:16,TALK:32},RAMP=12;
const mk=(C=Uint8Array)=>Array.from({length:H},()=>new C(W));
const gr=mk(),fl=mk(),ob=mk(Uint16Array),meta={};
fl.forEach(r=>r.fill(F.MOVE));
let sd=7;const rnd=()=>{sd=(sd+0x6D2B79F5)|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pick=a=>a[(rnd()*a.length)|0];
const hs=(x,y,s=0)=>{let h=Math.imul(x+s*131,374761393)+Math.imul(y,668265263);h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0};
const R=(g,x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
const dk=(h,a=.78)=>'#'+[1,3,5].map(i=>Math.min(255,Math.round(parseInt(h.substr(i,2),16)*a)).toString(16).padStart(2,'0')).join('');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const bgc=mkc(W*T,H*T),fgc=mkc(W*T,H*T),b=bgc.getContext('2d'),f=fgc.getContext('2d');
const SH2='#3a7c4e';
// ---- layout peta (isi array)
const box=(id,x0,y0,x1,y1)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&y>=0&&x<W&&y<H)gr[y][x]=id};
box(1,26,0,29,H-1);box(1,0,18,W-1,21);box(1,5,3,50,3);box(1,5,36,50,36);box(1,5,3,5,36);box(1,50,3,50,36);
box(3,8,6,47,33);box(2,26,6,29,33);box(2,8,18,47,21);box(4,20,13,35,26);
for(let y=4;y<=35;y++)for(let x=6;x<=49;x++)if(x<8||x>47||y<6||y>33){const gate=(x>=26&&x<=29)||(y>=18&&y<=21);
 if(gate){gr[y][x]=2}else{gr[y][x]=5;fl[y][x]=0}}
for(let i=0;i<4;i++){[[26+i,4],[26+i,35],[6,18+i],[49,18+i]].forEach(([x,y])=>fl[y][x]|=F.TOP);
 fl[0][26+i]|=F.NEXT;meta[(26+i)+',0']={next:'northern_plains_map'};fl[H-1][26+i]|=F.NEXT;meta[(26+i)+','+(H-1)]={next:'southern_farmland_map'};
 fl[18+i][0]|=F.NEXT;meta['0,'+(18+i)]={next:'western_forest_map'};fl[18+i][W-1]|=F.NEXT;meta[(W-1)+','+(18+i)]={next:'eastern_coast_map'}}
for(let y=12;y<=16;y++)for(let x=38;x<=42;x++){gr[y][x]=6;fl[y][x]|=F.HIGH}
[[40,12],[40,16],[38,14],[42,14]].forEach(([x,y])=>{gr[y][x]=7;fl[y][x]|=RAMP});
// ---- tanah
function grass(x,y){const ox=x*T,oy=y*T;R(b,ox,oy,T,T,(x+y)&1?'#5fa86c':'#64ad71');
for(let j=0;j<T;j++)for(let i=0;i<T;i++){const h=hs(x*T+i,y*T+j);if(h%29==0)R(b,ox+i,oy+j,1,1,'#7cc487');else if(h%41==1)R(b,ox+i,oy+j,1,1,'#4b955f')}
const h=hs(x,y,7);if(h%3==0){const i=ox+3+(h>>>3)%10,j=oy+3+(h>>>7)%9;R(b,i,j+1,1,1,SH2);R(b,i+1,j+2,1,1,SH2);R(b,i+2,j+1,1,1,SH2);R(b,i+1,j+1,1,1,'#8bd496')}}
function dirt(x,y){const ox=x*T,oy=y*T;R(b,ox,oy,T,T,'#cdb07c');
for(let j=0;j<T;j++)for(let i=0;i<T;i++){const h=hs(x*T+i,y*T+j,2);if(h%13==0)R(b,ox+i,oy+j,1,1,'#b4966a');else if(h%23==1)R(b,ox+i,oy+j,1,1,'#e2c996')}}
function cob(ox,oy,x,y,cols,m){R(b,ox,oy,T,T,m);for(let bj=0;bj<4;bj++){const off=(bj&1)*4;for(let bx=-off;bx<T;bx+=8){const x0=Math.max(bx+1,0),x1=Math.min(bx+8,T),c=cols[hs(x*2+(bx>>3),y*4+bj)%3];
 R(b,ox+x0,oy+bj*4+1,x1-x0,3,c);R(b,ox+x0,oy+bj*4+1,x1-x0,1,'#ffffff1c')}}}
const CL=['#bdb8aa','#b0ab9d','#c8c3b5'],CD=['#948f86','#8a857c','#9e9990'],CP=['#d2cdbb','#c6c1b0','#dcd7c6'],CW=['#8c8fa0','#7f8294','#9a9db0'],CS=['#d6d0c0','#cbc5b3','#e0dac9'];
function bakeGround(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){const id=gr[y][x],ox=x*T,oy=y*T;
 if(id==0)grass(x,y);else if(id==1)dirt(x,y);else if(id==2)cob(ox,oy,x,y,CL,'#8f8b80');else if(id==3)cob(ox,oy,x,y,CD,'#67645d');else if(id==4)cob(ox,oy,x,y,CP,'#9a9588');
 else if(id==5){cob(ox,oy,x,y,CW,'#5c5f6e');if(y>0&&gr[y-1][x]!=5){R(b,ox,oy,T,4,'#4a4c5a');R(b,ox+1,oy,6,4,'#b4b7c8');R(b,ox+9,oy,6,4,'#b4b7c8')}
  if(x>0&&gr[y][x-1]!=5)R(b,ox,oy,2,T,'#b4b7c8');if(x<W-1&&gr[y][x+1]!=5)R(b,ox+14,oy,2,T,'#4a4c5a');if(y<H-1&&gr[y+1][x]!=5)R(b,ox,oy+13,T,3,'#3a3c4a')}
 else if(id==6){cob(ox,oy,x,y,CS,'#a29c8c');if(gr[y+1][x]!=6&&gr[y+1][x]!=7)R(b,ox,oy+13,T,3,'#6e6a5e');if(gr[y-1][x]!=6&&gr[y-1][x]!=7)R(b,ox,oy,T,2,'#f0ead8')}
 else if(id==7){for(let k=0;k<4;k++){R(b,ox,oy+k*4,T,3,k&1?'#cbc5b3':'#e0dac9');R(b,ox,oy+k*4+3,T,1,'#7a7468')}}}}
bakeGround();
// ---- template objek: def(nama,{w,h,draw,top,sol,tp,dr,say})
const OB={},OBL=[];const def=(n,o)=>{o.id=OBL.length+1;OB[n]=o;OBL.push(n)};
function put(n,x,y,o={}){const D=OB[n],w=o.w||D.w,h=o.h||D.h,s=hs(x,y,5);D.draw(b,x*T,y*T,s,w,h,o);D.top&&D.top(f,x*T,y*T,s,w,h,o);
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const X=x+i,Y=y+j;if(X<0||Y<0||X>=W||Y>=H)continue;ob[Y][X]=D.id;
 if(!D.sol||D.sol(i,j,w,h))fl[Y][X]&=~F.MOVE;if(D.tp&&D.tp(i,j,w,h))fl[Y][X]|=F.TOP;
 const say=o.say||D.say;if(say&&(D.dr?D.dr(i,j,w,h):1)){fl[Y][X]|=F.TALK;meta[X+','+Y]={say}}}}
const free=(x,y,w=1,h=1)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){const X=x+i,Y=y+j;if(X<1||Y<1||X>=W-1||Y>=H-1)return 0;if((fl[Y][X]&~F.MOVE&~F.HIGH)||!(fl[Y][X]&F.MOVE)||ob[Y][X]||rs.has(X+','+Y))return 0}return 1};
const rs=new Set();
const RED=['#e08a5e','#c9603f','#8e3f2c','#a74c33'],BRN=['#c9a07a','#a07850','#6e4c32','#84603e'],BLU=['#a4b6d4','#7a90b4','#4f6488','#667ca0'],GRN=['#8cc880','#5ea060','#3c7040','#4c8650'],PUR=['#c49ae0','#9468c8','#5c3a90','#7a50b0'];
const WA=['#ecdfc2','#a89670','#d4c3a0','#ddd0b0'],WB=['#d8d2c4','#9a9484','#bcb5a4','#c8c2b4'],WC=['#e6cfa8','#a88a60','#c9ad82','#d6bd94'];
const TH={c:{r:[RED,BRN,BLU],w:[WA,WB,WC]},m:{r:[RED,BRN],w:[WA,WC],e:'m'},g:{r:[BLU],w:[WB,WA],e:'g'},cn:{r:[GRN],w:[WA,WB],e:'cn'},w:{r:[PUR],w:[WB],e:'w'}};
function emb(g,x,y,k){if(k=='m'){R(g,x,y,6,6,'#7a5a10');R(g,x+1,y+1,4,4,'#f0c830');R(g,x+2,y+2,1,2,'#fff0a0')}
 else if(k=='g'){R(g,x,y,6,7,'#202a50');R(g,x+1,y+1,4,5,'#4a6ac8');R(g,x+2,y+1,2,5,'#e8e8f0');R(g,x+1,y+3,4,1,'#e8e8f0')}
 else if(k=='cn'){R(g,x,y,6,7,'#1e4a2e');R(g,x+1,y+1,4,3,'#f4f4f0');R(g,x+1,y+4,4,2,'#3a9a58')}
 else if(k=='w'){R(g,x,y,6,6,'#2a1a50');R(g,x+2,y,2,6,'#f0d848');R(g,x,y+2,6,2,'#f0d848')}}
function win(g,x,y){R(g,x,y,14,14,'#5a4a38');R(g,x+1,y+1,12,12,'#f6f0e0');R(g,x+2,y+2,10,10,'#4f9bd0');R(g,x+2,y+2,10,3,'#8cc8ee');R(g,x+3,y+7,2,2,'#bfe4f8');R(g,x+6,y+2,2,10,'#f6f0e0');R(g,x+2,y+6,10,2,'#f6f0e0');R(g,x-1,y+14,16,2,'#b9a67e')}
def('house',{w:4,h:3,dr:(i,j,w,h)=>i==(w>>1)&&j==h-1,say:["Rumah warga. Pintunya terkunci."],draw(g,X,Y,s,w,h,o){
 const th=TH[o.th||'c'],P=w*T,Q=h*T,wh=h<4?22:30,rh=Q-wh,rc=th.r[s%th.r.length],wc=th.w[(s>>>4)%th.w.length];
 R(g,X+4,Y+Q,P,4,SH2);R(g,X+P,Y+10,4,Q-6,SH2);
 R(g,X,Y+rh,P,wh,wc[0]);for(let j=8;j<wh-6;j+=5)R(g,X,Y+rh+j,P,1,wc[3]);R(g,X,Y+rh,P,4,wc[1]);R(g,X+P-7,Y+rh+4,7,wh-9,wc[2]);R(g,X,Y+Q-5,P,5,'#8f897c');
 for(let j=0;j<rh;j++){const ins=j<rh*.55?Math.round((rh*.55-j)*.5):0,ov=j>=rh-5?2:0,x0=X+ins-ov,ww=P-2*ins+2*ov,m=j&3;let col=m==0?rc[0]:m==3?rc[2]:rc[1];if(j>=rh-4)col=j==rh-1?'#2a1a14':rc[2];
  R(g,x0,Y+j,ww,1,col);if(j<rh-4){R(g,x0+1,Y+j,3,1,rc[0]);R(g,x0+ww-4,Y+j,3,1,rc[2]);if(m>0&&m<3)for(let i=((j>>2)&1)?4:0;i<ww;i+=8)R(g,x0+i,Y+j,1,1,rc[3])}
  R(g,x0,Y+j,1,1,'#2a1a14');R(g,x0+ww-1,Y+j,1,1,'#2a1a14')}
 R(g,X+8,Y,P-16,1,'#2a1a14');R(g,X+9,Y+1,P-18,1,rc[0]);
 if(s%3==0&&w>=4){R(g,X+P-22,Y-4,7,12,'#8a6a5a');R(g,X+P-22,Y-4,7,2,'#4a3a32');R(g,X+P-16,Y-2,1,10,'#6a4e42')}
 if(th.e)emb(g,X+(P>>1)-3,Y+rh-13,th.e);
 for(let i=0;i<w;i++)if(i!=w>>1&&(w<5||i%2==0||i==w-1))win(g,X+i*T+1,Y+rh+(h<4?3:6));
 const dx=X+(w>>1)*T+2;R(g,dx-1,Y+Q-20,14,20,'#3a2412');R(g,dx,Y+Q-19,12,19,'#8a5430');R(g,dx,Y+Q-19,5,19,'#a46a3c');R(g,dx+10,Y+Q-19,2,19,'#6a3e20');R(g,dx+2,Y+Q-17,8,6,'#74461f');R(g,dx+9,Y+Q-8,2,2,'#f0d060');R(g,dx-2,Y+Q-1,16,2,'#cfc6b4');
 if(s%2==0){R(g,X+1,Y+Q-8,12,3,'#6a4426');for(let i=0;i<4;i++)R(g,X+2+i*3,Y+Q-10,2,2,pick(['#e8474d','#f0d848','#f4f4f0','#f08ac0']))}}});
def('stall',{w:2,h:2,say:["Dagangan lengkap, silakan lihat-lihat!","Sayang, belum ada fitur jual-beli."],draw(g,X,Y,s){const c=[['#d84a35','#f4f0e0'],['#3a8a4a','#f4f0e0'],['#3a5ac0','#f4f0e0'],['#d8a030','#f4f0e0']][s%4];
 R(g,X+3,Y+30,30,3,'#00000033');R(g,X+2,Y+12,2,19,'#6a4426');R(g,X+28,Y+12,2,19,'#6a4426');R(g,X+2,Y+20,28,10,'#9a6a3c');R(g,X+2,Y+20,28,2,'#c08a54');R(g,X+2,Y+28,28,2,'#6a4426');
 for(let i=0;i<6;i++)R(g,X+4+i*4,Y+17,3,3,['#d84a35','#e8c040','#6aaa48','#c48a50'][(s>>>i)%4]);
 for(let i=0;i<32;i+=4){const cc=(i>>2)&1?c[1]:c[0];R(g,X+i,Y+2,4,9,cc);R(g,X+i+1,Y+11,2,2,cc)}R(g,X,Y+2,32,2,'#ffffff33')}});
def('fountain',{w:3,h:3,say:["Air mancur kota Asteria. Airnya jernih sekali."],draw(g,X,Y,s){R(g,X+6,Y+8,36,34,'#8a867e');R(g,X+2,Y+14,44,22,'#8a867e');R(g,X+6,Y+10,36,2,'#b8b4aa');R(g,X+9,Y+13,30,24,'#4aa8d8');R(g,X+6,Y+17,36,16,'#4aa8d8');
 for(let i=0;i<14;i++)R(g,X+8+hs(i,s)%30,Y+16+hs(i,s,1)%16,2,1,'#9ee0f8');R(g,X+19,Y+14,10,14,'#b8b4aa');R(g,X+19,Y+14,3,14,'#d8d4ca');R(g,X+21,Y+10,6,6,'#d0ccc2');R(g,X+23,Y+4,2,7,'#80d0f0');R(g,X+20,Y+9,1,1,'#80d0f0');R(g,X+27,Y+9,1,1,'#80d0f0')}});
def('statue',{w:1,h:2,say:["Patung pendiri kota Asteria, berjubah hijau."],draw(g,X,Y){R(g,X+2,Y+27,12,5,'#00000033');R(g,X+2,Y+23,12,8,'#9a968c');R(g,X+2,Y+23,12,2,'#c0bcb2');R(g,X+5,Y+10,6,14,'#b4b0a6');R(g,X+5,Y+3,6,7,'#c8c4ba');R(g,X+4,Y+12,2,12,'#3a9a58');R(g,X+10,Y+10,1,14,'#8a867e')}});
const tre=(g,X,Y,s)=>{const P=[['#a6e46e','#5db553','#33894a','#1f5c3c'],['#c8e87a','#8ac050','#5a9a3a','#3a6a2a'],['#9adcb0','#4eb078','#2f8a58','#1f5c40']][s%3==2?1:s%7==0?2:0];
 for(let j=0;j<20;j++)for(let i=0;i<20;i++){const dx=i-9.5,dy=j-9.2,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),r=9.4+Math.sin(a*5+s%9)*.7;if(d>r)continue;let c;
 if(d>r-1.3)c='#143f2c';else{const t=(i+j)/38+((hs(i>>1,j>>1,s)%5)-2)*.05+d/90;c=P[t<.3?0:t<.52?1:t<.76?2:3];if(hs(i,j,3)%23==0&&t<.55)c='#d4f59a'}R(g,X+i,Y+j,1,1,c)}};
def('tree',{w:1,h:2,sol:(i,j,w,h)=>j==h-1,tp:(i,j)=>j==0,draw(g,X,Y){R(g,X+2,Y+28,13,4,SH2);R(g,X+6,Y+20,4,11,'#6a4426');R(g,X+6,Y+20,1,11,'#8a5a34');R(g,X+9,Y+20,1,11,'#4a2e18')},top(g,X,Y,s){tre(g,X-2,Y+2,s)}});
def('shrub',{w:1,h:1,draw(g,X,Y,s){const P=[['#7ad060','#4aa048','#2f7a38'],['#9ad870','#60b050','#3a8a40'],['#6ac090','#3e9a6a','#2a704c']][s%3];

function spawn(role,x0,y0,x1,y1,n,nw){const Ro=ROLES[role];for(let k=0;k<n;k++){for(let t=0;t<60;t++){const x=x0+((rnd()*(x1-x0+1))|0),y=y0+((rnd()*(y1-y0+1))|0);
 if(!(fl[y][x]&F.MOVE)||ob[y][x]||Math.abs(x-28)+Math.abs(y-29)<3||(fl[y][x]&(F.HIGH|F.NEXT))||npcs.some(m=>m.x==x&&m.y==y))continue;
 const nm=pick(NM),p=makeChar({skin:pick(SK),hair:pick(HC),hs:pick(['short','spiky','long','bun','short']),top:pick(Ro.tops),pants:pick(['#5b4b3d','#3a4a5a','#6a5a3a','#4a3a52']),shoe:'#d8d0c0',shoeS:'#4a3626',tr:Ro.tr()});
 const l=[pick(Ro.lines),pick(Ro.lines)];npcs.push({p,x,y,hx:x,hy:y,d:(rnd()*4)|0,mv:0,st:0,leg:0,wt:20+(rnd()*100|0),wander:k<nw,lines:[nm+": "+l[0]].concat(l[1]!=l[0]?[nm+": "+l[1]]:[])});break}}}
spawn('market',30,6,47,17,10,5);spawn('guild',8,22,25,33,8,3);spawn('council',8,6,25,17,7,3);spawn('wizard',30,22,47,33,7,3);spawn('outer',1,1,54,38,9,5);spawn('market',26,6,29,33,3,3);spawn('guild',8,18,47,21,3,3);
// ===== GAME =====
const cv=document.getElementById('g'),c=cv.getContext('2d'),ov=document.getElementById('o'),og=ov.getContext('2d'),wr=document.getElementById('w'),dl=document.getElementById('dl'),zn=document.getElementById('zn');
const V=[[0,1],[0,-1],[-1,0],[1,0]],K={ArrowDown:0,ArrowUp:1,ArrowLeft:2,ArrowRight:3},OPP=[1,0,3,2];
const pl={p:hero,x:28,y:29,tx:28,ty:29,d:1,mv:0,st:0,leg:0,tu:0,run:0,nx:0};
const lv=t=>(t&RAMP)==RAMP?-1:t&F.HIGH?1:0;
const canStep=(ax,ay,bx,by)=>bx>=0&&by>=0&&bx<W&&by<H&&(fl[by][bx]&F.MOVE)&&(lv(fl[ay][ax])==-1||lv(fl[by][bx])==-1||lv(fl[ay][ax])==lv(fl[by][bx]));
const occ=(x,y,s)=>(s!==pl&&((pl.x==x&&pl.y==y)||(pl.mv&&pl.tx==x&&pl.ty==y)))||npcs.some(n=>n!==s&&((n.x==x&&n.y==y)||(n.mv&&n.tx==x&&n.ty==y)));
let held=[],act=0,grid=1,q=[],qi=0,txt='',shown=0;
addEventListener('keydown',e=>{if(e.code in K||e.code=='Space')e.preventDefault();
 if(e.code in K){if(!held.includes(e.code))held.push(e.code)}else if(e.code=='Space'&&!e.repeat)act=1;else if(e.code=='KeyG')grid^=1});
addEventListener('keyup',e=>{held=held.filter(k=>k!=e.code)});
const say=a=>{q=a;qi=0;txt=a[0];shown=0;dl.style.display='block'};
function advance(){if(shown<txt.length){shown=txt.length;return}if(++qi>=q.length){q=[];dl.style.display='none'}else{txt=q[qi];shown=0}}
const zone=(x,y)=>x>=20&&x<=35&&y>=13&&y<=26?'Kastil Asteria':x>=8&&x<=47&&y>=6&&y<=33?(x<28?(y<20?'Distrik Dewan':'Distrik Guild'):(y<20?'Distrik Pasar':'Distrik Sihir')):x>=6&&x<=49&&y>=4&&y<=35?'Tembok & Gerbang':'Lingkar Luar';
let zlast='';
function updNpc(n){if(n.mv){n.st++;if(n.st>=12){n.x=n.tx;n.y=n.ty;n.mv=0;n.st=0;n.leg^=1}return}
 if(--n.wt>0)return;n.wt=(n.wander?20:80)+(rnd()*90|0);const d=(rnd()*4)|0;n.d=d;if(!n.wander)return;
 const nx=n.x+V[d][0],ny=n.y+V[d][1];if(Math.abs(nx-n.hx)+Math.abs(ny-n.hy)<=6&&canStep(n.x,n.y,nx,ny)&&!(fl[ny][nx]&(F.NEXT|F.HIGH))&&!occ(nx,ny,n)){n.mv=1;n.st=0;n.tx=nx;n.ty=ny}}
function update(){
 if(q.length){shown=Math.min(txt.length,shown+.7);if(act)advance();act=0;return}
 npcs.forEach(updNpc);
 if(pl.mv){pl.st++;if(pl.st<STEP)return;pl.x=pl.tx;pl.y=pl.ty;pl.mv=0;pl.st=0;pl.leg^=1;pl.run=1;
  const m=meta[pl.x+','+pl.y];if(m&&m.next&&!pl.nx){pl.nx=1;say(["Gerbang menuju area luar: toNextInstance('"+m.next+"')","Area itu belum tersedia."]);return}if(!m||!m.next)pl.nx=0}
 if(act){act=0;const X=pl.x+V[pl.d][0],Y=pl.y+V[pl.d][1],n=npcs.find(n=>n.x==X&&n.y==Y);
  if(n){n.d=OPP[pl.d];n.wt=120;say(n.lines)}else{const m=meta[X+','+Y];if(m&&m.say)say(m.say)}return}
 const hk=held[held.length-1];if(hk==null){pl.tu=0;pl.run=0;return}
 const d=K[hk];if(d!=pl.d){pl.d=d;if(!pl.run){pl.tu=4;return}}
 if(pl.tu>0){pl.tu--;return}
 const nx=pl.x+V[d][0],ny=pl.y+V[d][1];if(canStep(pl.x,pl.y,nx,ny)&&!occ(nx,ny,pl)){pl.mv=1;pl.st=0;pl.tx=nx;pl.ty=ny}else pl.run=0}
function draw(){
 const off=pl.mv?Math.round(pl.st*T/STEP):0,px=pl.x*T+V[pl.d][0]*off,py=pl.y*T+V[pl.d][1]*off,fr=pl.mv?(pl.st<5?(pl.leg?3:1):2):0;
 const cx=Math.max(0,Math.min(W*T-240,Math.round(px+8-120))),cy=Math.max(0,Math.min(H*T-160,Math.round(py+8-80)));
 c.imageSmoothingEnabled=false;c.drawImage(bgc,-cx,-cy);
 const E=[{y:py,x:px,d:pl.d,f:fr,p:pl.p}];
 npcs.forEach(n=>{const o=n.mv?Math.round(n.st*T/12):0,x=n.x*T+V[n.d][0]*o,y=n.y*T+V[n.d][1]*o;if(x>cx-20&&x<cx+260&&y>cy-20&&y<cy+180)E.push({y,x,d:n.d,f:n.mv?(n.st<6?(n.leg?3:1):2):0,p:n.p})});
 E.sort((a,e)=>a.y-e.y).forEach(e=>c.drawImage(spr(e.p,e.d,e.f),e.x-cx-1,e.y-cy-6));
 c.drawImage(fgc,-cx,-cy);
 const w=cv.clientWidth,h=cv.clientHeight,s=w/240;wr.style.setProperty('--s',s);
 if(ov.width!=w||ov.height!=h){ov.width=w;ov.height=h}og.clearRect(0,0,w,h);
 if(grid){og.strokeStyle='rgba(255,255,255,.35)';og.lineWidth=1;og.beginPath();
  for(let x=Math.ceil(cx/T)*T;x<cx+240;x+=T){const X=Math.round((x-cx)*s)+.5;og.moveTo(X,0);og.lineTo(X,h)}
  for(let y=Math.ceil(cy/T)*T;y<cy+160;y+=T){const Y=Math.round((y-cy)*s)+.5;og.moveTo(0,Y);og.lineTo(w,Y)}og.stroke()}
 const z=zone(pl.x,pl.y);if(z!=zlast){zlast=z;zn.textContent=z}
 if(q.length){const t=txt.slice(0,shown|0);if(dl._t!==t){dl._t=t;dl.textContent=t;if(shown>=txt.length){const i=document.createElement('i');i.textContent='▼';dl.appendChild(i)}}}}
let last=0,acc=0;function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
